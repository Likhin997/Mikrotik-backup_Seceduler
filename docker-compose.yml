version: '3.8'

services:
  mikrotik-backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: mikrotik-backup-manager:latest
    container_name: mikrotik-backup-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Opsional: Jika menggunakan domain / reverse proxy (Nginx / Cloudflare Tunnel / Traefik / IP VPS)
      # - APP_URL=http://192.168.1.100:3000
    volumes:
      # Data konfigurasi router & file backup MikroTik tersimpan permanen di folder host ./data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
